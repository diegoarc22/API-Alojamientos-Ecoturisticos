app.entorno.nombre=PRODUCCION - H2 en disco

spring.datasource.url=jdbc:h2:file:./data/alojamientosdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=prod_secret

# La rubrica pide validate. validate NO crea tablas: para la PRIMERA demo arranca una vez con
# update (para crear ./data/alojamientosdb) y despues vuelve a validate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false
